<title>Доступ по коду</title>
<style>
  :root { --bg: #F3F5F8; --card: #FFFFFF; --ink: #142536; --ink-2: #5A6B7C; --line: #D5DDE5; --accent: #0B5A92; --accent-ink: #FFFFFF; --bad: #B4232C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B2531; --card: #25313F; --ink: #E3E9EF; --ink-2: #A7B5C3; --line: #3A4A5C; --accent: #3D8BCD; --accent-ink: #F4F7FA; --bad: #F2878D; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .gate { width: 100%; max-width: 360px; display: grid; gap: 18px; padding: 32px 26px 28px; border-radius: 22px; background: var(--card); box-shadow: 0 30px 60px -40px rgba(10,30,50,.45); text-align: center; }
  .lock { justify-self: center; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .lock svg { width: 26px; height: 26px; }
  h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  input { width: 100%; height: 64px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; color: var(--ink); font: inherit; font-size: 30px; font-weight: 650; letter-spacing: .42em; text-indent: .42em; text-align: center; font-variant-numeric: tabular-nums; outline: none; transition: border-color 150ms ease; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--line); letter-spacing: .42em; }
  button { height: 52px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; transition: transform 150ms ease, opacity 150ms ease; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 1.5em; margin: -6px 0 0; font-size: 15px; color: var(--ink-2); }
  .msg.bad { color: var(--bad); }
  .shake { animation: shake 360ms ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .busy .gate { opacity: .0; }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } * { transition: none !important; } }
</style>

<script>
(function () {
  'use strict';
  var KEY = 'nn-demo-key';                     // ключ на время сеанса браузера, общий для всех страниц сайта
  var P = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate'), pin = document.getElementById('pin'), go = document.getElementById('go'), msg = document.getElementById('msg');
  var subtle = window.crypto && window.crypto.subtle;

  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  function deriveBits(code) {
    return subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256);
    });
  }
  function decrypt(raw) {
    return subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']).then(function (k) {
      return subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, k, bytes(P.d));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) {
    // пока страница ввода кода ещё дочитывается, document.open() не заменит документ: ждём загрузки
    if (document.readyState !== 'complete') { window.addEventListener('load', function () { setTimeout(function () { show(html); }, 0); }, { once: true }); return; }
    var hash = location.hash;
    document.open(); document.write(html); document.close();
    if (hash.length > 1) setTimeout(function () { var el = document.getElementById(decodeURIComponent(hash.slice(1))); if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' }); }, 120);
  }
  function fail(text) {
    document.documentElement.classList.remove('busy');
    msg.textContent = text; msg.className = 'msg bad';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    go.disabled = false; pin.value = ''; pin.focus();
  }

  if (!subtle) { msg.textContent = 'Страница открывается только по защищённой ссылке (https).'; go.disabled = true; return; }

  // Код уже вводили в этом сеансе: открываем сразу
  var saved = read(KEY);
  if (saved) {
    document.documentElement.classList.add('busy');
    decrypt(bytes(saved)).then(show, function () { store(KEY, null); document.documentElement.classList.remove('busy'); pin.focus(); });
  } else {
    pin.focus();
  }

  function submit() {
    var code = pin.value.replace(/\D/g, '');
    if (code.length < 6) { fail('Код состоит из 6 цифр'); return; }
    go.disabled = true; msg.textContent = 'Проверяем…'; msg.className = 'msg';
    var bits;
    deriveBits(code).then(function (b) { bits = b; return decrypt(b); }).then(function (html) {
      store(KEY, b64(bits)); show(html);
    }, function () { fail('Неверный код'); });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  pin.addEventListener('input', function () {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 6);
    if (msg.className.indexOf('bad') >= 0) { msg.textContent = ''; msg.className = 'msg'; }
    if (pin.value.length === 6 && !go.disabled) submit();
  });
})();
</script>
